<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Zuzanna Fit">
<meta name="theme-color" content="#fff3f8">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Zuzanna Fit</title>
<style>
:root{--bg:#fff5f9;--card:#fff;--pink:#f7b6cf;--pd:#d9618f;--soft:#fde4ee;--tx:#4a2535;--mu:#9b7585;--ok:#e07aa3}
@media(prefers-color-scheme:dark){:root{--bg:#2a1822;--card:#3a2230;--soft:#4a2a3b;--tx:#fbe9f1;--mu:#d0a3b8}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 ui-rounded,"SF Pro Rounded",-apple-system,system-ui,sans-serif}
#app{max-width:520px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 14px) 14px calc(env(safe-area-inset-bottom) + 96px)}
h1{font-size:26px;margin:4px 2px 2px;letter-spacing:-.3px}h2{font-size:18px;margin:0}
.sub{color:var(--mu);margin:0 2px 14px;font-size:14px}
.card{background:var(--card);border-radius:20px;padding:14px;margin-bottom:12px;box-shadow:0 2px 12px rgba(217,97,143,.12);border:1px solid var(--soft)}
.row{display:flex;gap:8px;align-items:center}.sp{justify-content:space-between}
.note{color:var(--mu);font-size:13px;margin:2px 0 8px}
.hint{background:var(--soft);border-radius:12px;padding:6px 10px;font-size:13px;margin-bottom:8px;color:var(--pd);font-weight:600}
.set{display:grid;grid-template-columns:28px 1fr 1fr 44px;gap:8px;align-items:center;margin-bottom:6px}
.set b{color:var(--mu);text-align:center;font-size:14px}
input,select{width:100%;font:inherit;padding:10px;border-radius:12px;border:1.5px solid var(--soft);background:var(--bg);color:var(--tx);text-align:center}
input:focus,select:focus{outline:2px solid var(--pink);border-color:var(--pink)}
.chk{width:44px;height:44px;border-radius:50%;border:2px solid var(--pink);background:none;color:#fff;font-size:20px}
.chk.on{background:var(--pd);border-color:var(--pd)}
button{font:inherit;cursor:pointer}
.btn{width:100%;padding:14px;border:0;border-radius:16px;background:var(--pd);color:#fff;font-weight:700}
.btn.alt{background:var(--soft);color:var(--pd)}
.link{background:none;border:0;color:var(--pd);font-weight:600;padding:6px}
.pick{display:block;width:100%;text-align:left;background:var(--card);border:1.5px solid var(--soft);border-radius:20px;padding:14px;margin-bottom:10px;color:var(--tx)}
.pick.next{border-color:var(--pd);background:var(--soft)}
.tabs{position:fixed;left:0;right:0;bottom:0;display:flex;gap:8px;padding:10px 14px calc(env(safe-area-inset-bottom) + 10px);background:var(--bg);border-top:1px solid var(--soft)}
.tabs button{flex:1;padding:12px;border:0;border-radius:14px;background:none;color:var(--mu);font-weight:700}
.tabs button.on{background:var(--pink);color:#4a2535}
.wu label{display:flex;gap:10px;align-items:center;padding:6px 0}
.wu input{width:22px;height:22px;accent-color:var(--pd)}
.stat{flex:1;background:var(--soft);border-radius:14px;padding:8px;text-align:center;font-size:13px;color:var(--mu)}.stat b{display:block;font-size:18px;color:var(--pd)}
svg{width:100%;height:auto}
</style></head><body><div id="app"></div>
<nav class="tabs"><button id="t1" data-v="train">Train</button><button id="t2" data-v="prog">Progress</button></nav>
<script>
// [id, name, sets, minReps, maxReps, note, kg increment]
const W={
A:{n:"Workout A",sub:"Squats · back · glutes",fin:"Finish: 10 min walk on an elevated treadmill",ex:[
["sq","Barbell squats",4,3,5,"3–5 sets, leave 1–3 reps in reserve",2.5],
["lp","Single-leg press (each leg)",2,10,12,"Leg placed high. Close to failure. Never lock the knees.",2.5],
["lat","Lat pulldowns",3,8,10,"Last set: drop the weight and go to failure, no rest",2.5],
["kb","Cable kickbacks (each leg)",3,12,15,"Slow 2 sec lowering, tiny pause at the top, to failure",1.25],
["tri","Tricep cable pushdowns",3,10,15,"Superset with face pulls",1.25],
["fp","Face pulls",3,10,15,"Squeeze shoulder blades together, not just arms",1.25]]},
B:{n:"Workout B",sub:"Hinge · shoulders · glutes",fin:"Finish: elevated walk or stair master",ex:[
["rdl","Romanian deadlifts",3,6,8,"Don't reach failure. Control down, explode up.",2.5],
["sp","Shoulder press (dumbbell/machine)",3,10,12,"Pick a weight you're confident with",1],
["ht","Hip thrusts, 1 sec pause",3,10,12,"2 sets of 10–12, then a back-off set: ~half the weight, as many reps as possible",2.5],
["lr","Lateral raises",3,10,10,"No momentum",0.5],
["ha","Hip abductions",3,12,12,"Lean forward slightly. Last set: as many reps as possible",2.5],
["row","Seated cable rows",3,12,12,"Challenging, close to failure",2.5]]},
C:{n:"Workout C",sub:"Paused squats · arms · power",fin:"Core: straight leg raises or Russian twists (alternate each week)",ex:[
["psq","Paused barbell squats",4,4,4,"3–5 sets. Challenging but not to failure. Keep form.",2.5],
["bc","Bicep curls",3,10,10,"",1],
["gk","Glute cable kickbacks (each leg)",3,12,15,"Controlled, to failure or 1 rep short",1.25],
["pu","Push-ups from the knees",2,0,0,"To failure. Try to add reps each session. Elbows at 45°.",0],
["bj","Box jumps",5,6,6,"Rest until your breathing calms down",0],
["core","Leg raises / Russian twists",3,10,15,"Alternate each week",0]]}};
const ALL=Object.values(W).flatMap(w=>w.ex);const EX=Object.fromEntries(ALL.map(e=>[e[0],e]));
let S={sessions:[],draft:null},view="train",sel="sq";
try{S=JSON.parse(localStorage.getItem("zfit"))||S}catch(e){}
const save=()=>{try{localStorage.setItem("zfit",JSON.stringify(S))}catch(e){}};
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt=n=>+(+n).toFixed(2);
function last(id){for(let i=S.sessions.length-1;i>=0;i--){const s=S.sessions[i].log[id];if(s&&s.length)return{s,date:S.sessions[i].date}}}
function suggest(id){const e=EX[id],l=last(id);if(!l)return{txt:"First time: find a weight that feels right",w:""};
 const top=Math.max(...l.s.map(x=>x.w)),at=l.s.filter(x=>x.w===top),reps=l.s.map(x=>x.r).join(", ");
 const lab=`Last: ${top?fmt(top)+" kg × ":""}${reps}`;
 if(!e[6]){const m=Math.max(...l.s.map(x=>x.r));return{txt:`${lab} → beat ${m} reps`,w:top||""}}
 if(at.length>=Math.min(e[2],l.s.length)&&at.every(x=>x.r>=e[4]))return{txt:`${lab} → go up: ${fmt(top+e[6])} kg`,w:top+e[6]};
 return{txt:`${lab} → stay at ${fmt(top)} kg, add a rep`,w:top}}
function nextW(){const l=S.sessions[S.sessions.length-1];return l?{A:"B",B:"C",C:"A"}[l.w]:"A"}
function start(k){const sets={};W[k].ex.forEach(e=>{const g=suggest(e[0]).w;sets[e[0]]=Array.from({length:e[2]},()=>({w:g,r:"",d:0}))});S.draft={w:k,sets,wu:[0,0],t:Date.now()};save();draw()}
function trainView(){const d=S.draft;
 if(!d)return`<h1>Hi Zuzanna 🌸</h1><p class="sub">Pick today's workout. Rest a day between sessions (Mon · Wed · Fri).</p>`+
 Object.entries(W).map(([k,w])=>`<button class="pick ${k===nextW()?"next":""}" data-a="start" data-k="${k}"><h2>${w.n}${k===nextW()?" · up next":""}</h2><div class="note">${w.sub}</div></button>`).join("")+
 `<p class="sub">${S.sessions.length} workouts logged so far.</p>`;
 const w=W[d.w];
 return`<h1>${w.n}</h1><p class="sub">${w.sub}</p>
 <div class="card wu"><h2>Warm-up</h2><label><input type="checkbox" data-a="wu" data-i="0" ${d.wu[0]?"checked":""}>3–5 min rower, elliptical or fan bike</label><label><input type="checkbox" data-a="wu" data-i="1" ${d.wu[1]?"checked":""}>2–3 min joint warm-up and dynamic stretches</label></div>`+
 w.ex.map(e=>{const id=e[0],sg=suggest(id);return`<div class="card"><h2>${e[1]}</h2><div class="note">${e[2]} × ${e[3]===e[4]?(e[3]||"failure"):e[3]+"–"+e[4]}${e[5]?" · "+e[5]:""}</div><div class="hint">${sg.txt}</div>
 ${d.sets[id].map((s,i)=>`<div class="set"><b>${i+1}</b><input type="number" inputmode="decimal" placeholder="kg" value="${s.w}" data-e="${id}" data-i="${i}" data-f="w"><input type="number" inputmode="numeric" placeholder="reps" value="${s.r}" data-e="${id}" data-i="${i}" data-f="r"><button class="chk ${s.d?"on":""}" data-a="done" data-e="${id}" data-i="${i}">✓</button></div>`).join("")}
 <button class="link" data-a="add" data-e="${id}">+ Add set</button></div>`}).join("")+
 `<div class="card"><b>${w.fin}</b></div><button class="btn" data-a="finish">Finish and save</button><p></p><button class="btn alt" data-a="discard">Discard workout</button>`}
function chart(id){const pts=S.sessions.filter(s=>s.log[id]&&s.log[id].length).map(s=>{const a=s.log[id],tw=Math.max(...a.map(x=>x.w));return{d:s.date,v:tw>0?tw:Math.max(...a.map(x=>x.r)),u:tw>0?"kg":"reps"}});
 if(!pts.length)return`<p class="note">No sessions logged for this exercise yet.</p>`;
 const vs=pts.map(p=>p.v),mn=Math.min(...vs),mx=Math.max(...vs),r=mx-mn||1,X=i=>20+(pts.length>1?i*(280/(pts.length-1)):140),Y=v=>110-((v-mn)/r)*90;
 return`<div class="row" style="margin-bottom:8px"><div class="stat"><b>${fmt(mx)} ${pts[0].u}</b>best</div><div class="stat"><b>${fmt(vs[vs.length-1])} ${pts[0].u}</b>latest</div><div class="stat"><b>${pts.length}</b>sessions</div></div>
 <svg viewBox="0 0 320 130"><polyline fill="none" stroke="#d9618f" stroke-width="3" stroke-linejoin="round" points="${pts.map((p,i)=>X(i)+","+Y(p.v)).join(" ")}"/>${pts.map((p,i)=>`<circle cx="${X(i)}" cy="${Y(p.v)}" r="4.5" fill="#f7b6cf" stroke="#d9618f" stroke-width="2"/>`).join("")}</svg><p class="note">Heaviest set per session (reps if bodyweight)</p>`}
function progView(){const h=[...S.sessions].reverse();
 return`<h1>Progress</h1><p class="sub">Your numbers, going up.</p><div class="card"><select data-a="sel">${ALL.map(e=>`<option value="${e[0]}" ${e[0]===sel?"selected":""}>${e[1]}</option>`).join("")}</select><p></p>${chart(sel)}</div>
 <div class="card"><h2>History</h2>${h.length?h.map((s,i)=>`<div class="row sp" style="padding:8px 0;border-top:1px solid var(--soft)"><div><b>${W[s.w].n}</b><div class="note" style="margin:0">${new Date(s.date).toLocaleDateString("en-GB",{weekday:"short",day:"numeric",month:"short"})} · ${Object.values(s.log).reduce((a,b)=>a+b.length,0)} sets</div></div><button class="link" data-a="del" data-i="${S.sessions.length-1-i}">Delete</button></div>`).join(""):`<p class="note">Nothing logged yet. Your first workout will show up here.</p>`}</div>
 <div class="card"><h2>Backup</h2><p class="note">Data lives on this phone. Save a copy now and then.</p><div class="row"><button class="btn alt" data-a="exp">Export</button><button class="btn alt" data-a="imp">Import</button></div></div>`}
function draw(){$("#app").innerHTML=view==="train"?trainView():progView();$("#t1").classList.toggle("on",view==="train");$("#t2").classList.toggle("on",view==="prog")}
document.addEventListener("input",e=>{const t=e.target,d=S.draft;if(t.dataset.e&&d){d.sets[t.dataset.e][t.dataset.i][t.dataset.f]=t.value;save()}});
document.addEventListener("change",e=>{if(e.target.dataset.a==="sel"){sel=e.target.value;draw()}if(e.target.dataset.a==="wu"){S.draft.wu[e.target.dataset.i]=e.target.checked?1:0;save()}});
document.addEventListener("click",e=>{const t=e.target.closest("[data-a],[data-v]");if(!t)return;const D=t.dataset,d=S.draft;
 if(D.v){view=D.v;draw();return}
 if(D.a==="start")start(D.k);
 else if(D.a==="done"){const s=d.sets[D.e][D.i];s.d=s.d?0:1;save();draw()}
 else if(D.a==="add"){const a=d.sets[D.e];a.push({w:a.length?a[a.length-1].w:"",r:"",d:0});save();draw()}
 else if(D.a==="discard"){if(confirm("Discard this workout?")){S.draft=null;save();draw()}}
 else if(D.a==="finish"){const log={};for(const id in d.sets){const a=d.sets[id].filter(s=>s.r!==""&&+s.r>0).map(s=>({w:+s.w||0,r:+s.r}));if(a.length)log[id]=a}
  if(!Object.keys(log).length){alert("Add reps to at least one set first.");return}
  S.sessions.push({date:new Date().toISOString(),w:d.w,log});S.draft=null;save();view="prog";draw()}
 else if(D.a==="del"){if(confirm("Delete this workout?")){S.sessions.splice(+D.i,1);save();draw()}}
 else if(D.a==="exp"){const b=new Blob([JSON.stringify(S)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="zuzanna-fit-backup.json";a.click()}
 else if(D.a==="imp"){const i=document.createElement("input");i.type="file";i.accept=".json";i.onchange=()=>i.files[0].text().then(x=>{try{const j=JSON.parse(x);if(!Array.isArray(j.sessions))throw 0;S=j;save();draw()}catch(_){alert("That file isn't a Zuzanna Fit backup.")}});i.click()}});
draw();if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
</script></body></html>
